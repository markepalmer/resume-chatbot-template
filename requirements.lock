# Fully pinned dependency set, generated from the linux/amd64 image that is
# running in production (resume-chatbot:v3, extracted with 'pip freeze').
#
# requirements.txt lists the direct dependencies and their acceptable ranges;
# this file is what actually gets installed, so that two builds a month apart
# produce the same image. Ranges alone meant a transitive release could change
# the running site with no commit of yours in between, and the failure mode is
# 'it broke and I didn't touch it'.
#
# Regenerate deliberately, not casually, and only after testing the result:
#
#   docker run --rm --platform linux/amd64 -v "$PWD":/w -w /w python:3.11-slim \
#     sh -c "pip install -q -r requirements.txt && pip freeze" > requirements.lock
#
# That resolves requirements.txt from scratch. Do NOT regenerate by running
# 'pip freeze' inside a built app image: the image installs this lock, so a
# dependency newly added to requirements.txt would never appear in the output.
# Regenerating also picks up upstream releases across every range at once, which
# is why it wants testing rather than being run on autopilot.
#
# Re-add this header afterwards; the redirect above overwrites it.
#
# Platform matters: these are the versions resolved for linux/amd64. Freezing a
# local macOS/arm64 virtualenv instead would pin wheels that do not exist for
# the deploy target.

