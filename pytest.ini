[pytest]
testpaths = tests
# Repo root on sys.path so `import app...`, `import tools...` and
# `import scripts...` resolve without an installed package.
pythonpath = .

# Slow tests build embeddings or a FAISS index and are deselected by default.
# Run them with:  python3 -m pytest -m slow
# Nothing in this suite makes a network call or a Groq call, slow or not.
addopts = -m "not slow" --strict-markers
markers =
    slow: needs embeddings or a FAISS index; deselected by default
